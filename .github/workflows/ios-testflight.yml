name: iOS TestFlight

# Builds a signed iOS .ipa and uploads it to TestFlight using
# Xcode automatic signing driven by an App Store Connect API key.
# No manual .p12 or .mobileprovision secrets required.
#
# Required GitHub repository secrets:
#   ASC_KEY_ID                       App Store Connect API key ID (10 chars)
#                                    APP_STORE_CONNECT_API_KEY_ID is also accepted for compatibility.
#   APP_STORE_CONNECT_API_ISSUER_ID   Issuer ID UUID
#   APP_STORE_CONNECT_API_KEY_P8      Full contents of AuthKey_XXXX.p8
#   IOS_TEAM_ID                       Apple Developer Team ID (10 chars)
#   IOS_BUNDLE_ID (optional)          Defaults to com.thefridgeandcupboard.app
#
# The API key user in App Store Connect must have the "Admin" or "App Manager"
# role so Xcode can create/download signing assets on demand.

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Override CFBundleVersion. Leave blank to use run number.'
        required: false

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-upload:
    name: Build signed IPA & upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID || 'com.thefridgeandcupboard.app' }}
      IOS_SCHEME: App
      IOS_WORKSPACE: ios/App/App.xcworkspace
      IOS_CONFIGURATION: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Select Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then LATEST=/Applications/Xcode.app; fi
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web bundle
        env:
          NODE_ENV: production
        run: bun run build

      - name: Sync Capacitor iOS
        run: |
          if [ ! -d "ios" ]; then
            echo "::error::ios/ directory missing. Run 'npx cap add ios' locally and commit."
            exit 1
          fi
          bunx cap sync ios

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install --clean-install

      - name: Derive build number
        id: buildnum
        run: |
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            BN="${{ github.event.inputs.build_number }}"
          else
            BN="${{ github.run_number }}"
          fi
          echo "build_number=$BN" >> "$GITHUB_OUTPUT"

      - name: Derive marketing version from tag
        id: version
        run: |
          REF="${GITHUB_REF##*/}"
          if [[ "$REF" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VN="${BASH_REMATCH[1]}"
          else
            VN="1.0.0"
          fi
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"

      - name: Verify App Store Connect secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          missing=0
          for name in ASC_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8 IOS_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub repo secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Add the missing secret(s) in GitHub → Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi
          # Basic shape check for the Key ID (typically 10 uppercase alphanumerics)
         

      - name: Write App Store Connect API key
        id: asckey
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/asc"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY_P8" | tr -d '\r' > "$KEY_PATH"

          chmod 600 "$KEY_PATH"
          # Also install to the location xcodebuild checks automatically.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "key_path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Build archive (automatic signing)
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration "$IOS_CONFIGURATION" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.asckey.outputs.key_path }}" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
             PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
             CURRENT_PROJECT_VERSION="${{ steps.buildnum.outputs.build_number }}" \
             MARKETING_VERSION="${{ steps.version.outputs.version_name }}" 
    -     - name:  Export IPA
    
    
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.asckey.outputs.key_path }}" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"

          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA_PATH=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No .ipa found after export"
            exit 1
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            --verbose
